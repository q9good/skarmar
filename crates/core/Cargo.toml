[package]
name = "skarma-core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "wasmbind"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
