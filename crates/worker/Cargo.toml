[package]
name = "skarma-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
skarma-core = { path = "../core" }
skarma-http = { path = "../http" }
worker = { version = "=0.8.7", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["json"] }
serde_json = "1"
tower-service = "0.3"
