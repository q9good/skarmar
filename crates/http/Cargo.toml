[package]
name = "skarma-http"
version = "0.1.0"
edition = "2024"

[dependencies]
skarma-core = { path = "../core" }
axum = { version = "0.8", default-features = false, features = ["json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rust_xlsxwriter = { version = "0.99.1", features = ["wasm"] }
