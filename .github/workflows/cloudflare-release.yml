name: Cloudflare release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA of the selected feature branch
        required: true
        type: string
      restore_demo:
        description: Append the reviewed synthetic 20261023 batch before release and link courses after activation
        required: false
        type: boolean
        default: false
      verify_version:
        description: Optional active version UUID to verify without uploading or deploying
        required: false
        type: string
      activate_prd_empty:
        description: One-time empty PRD domain, preserving original accounts and legacy tables
        required: false
        type: boolean
        default: false
  push:
    branches: [feat/tencent-informed-web]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test release guards without credentials or network
        run: |
          python3 -m unittest discover -s tools -p 'test_cloudflare_release.py' -v
          python3 -m unittest discover -s tools -p 'test_restore_demo_batch.py' -v

  release:
    needs: validate
    if: >-
      github.repository == 'q9good/skarmar' &&
      github.ref == 'refs/heads/feat/tencent-informed-web' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[deploy-cloudflare]') ||
       contains(github.event.head_commit.message, '[verify-cloudflare:'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: skarma-existing-cloudflare-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      CI: 'true'
    steps:
      - name: Require securely configured credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKARMA_WRANGLER_TOML: ${{ secrets.SKARMA_WRANGLER_TOML }}
          SKARMA_TEST_LOGIN: ${{ secrets.SKARMA_TEST_LOGIN }}
          RESTORE_DEMO: ${{ inputs.restore_demo || contains(github.event.head_commit.message, '[restore-demo:20261023]') }}
          VERIFY_VERSION: ${{ inputs.verify_version }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ACTIVATE_PRD_EMPTY: ${{ inputs.activate_prd_empty || contains(github.event.head_commit.message, '[activate-prd-empty]') }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing repository secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$SKARMA_WRANGLER_TOML" || { echo '::error::Missing repository secret SKARMA_WRANGLER_TOML (existing private production configuration)'; exit 1; }
          if [ "$RESTORE_DEMO" = 'true' ]; then
            test -z "$VERIFY_VERSION" && [[ "$HEAD_MESSAGE" != *"[verify-cloudflare:"* ]] || { echo '::error::Restore cannot run in verify-only mode'; exit 1; }
            test -n "$SKARMA_TEST_LOGIN" || { echo '::error::Missing repository secret SKARMA_TEST_LOGIN (existing approved application login)'; exit 1; }
          fi
          if [ "$ACTIVATE_PRD_EMPTY" = 'true' ]; then
            test "$RESTORE_DEMO" != 'true' && test -z "$VERIFY_VERSION" && [[ "$HEAD_MESSAGE" != *"[verify-cloudflare:"* ]] || { echo '::error::PRD cutover cannot restore legacy demo data or run verify-only'; exit 1; }
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the exact source selected for this run
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Install pinned Rust toolchain
        if: inputs.verify_version == '' && !contains(github.event.head_commit.message, '[verify-cloudflare:')
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --target wasm32-unknown-unknown
          cargo install worker-build --version 0.8.7 --locked
      - name: Validate and build mobile Web
        run: |
          npm run typecheck
          npm run web:build
      - name: Validate Rust application
        if: inputs.verify_version == '' && !contains(github.event.head_commit.message, '[verify-cloudflare:')
        run: |
          cargo test --workspace --locked -j 4
          cargo clippy -p skarma-worker --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Append reviewed synthetic records before releasing code
        if: inputs.restore_demo || contains(github.event.head_commit.message, '[restore-demo:20261023]')
        env:
          SKARMA_TEST_LOGIN: ${{ secrets.SKARMA_TEST_LOGIN }}
        run: |
          remote_sha=$(git ls-remote origin refs/heads/feat/tencent-informed-web | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA" || { echo '::error::Branch moved before restore'; exit 1; }
          python3 tools/restore_demo_batch.py --phase base --confirm-append skarma-demo-20261023
      - name: Rehearse empty PRD baseline on synthetic local stores
        if: inputs.activate_prd_empty || contains(github.event.head_commit.message, '[activate-prd-empty]')
        run: |
          cargo build -p skarma-api --locked -j 4
          (cd crates/worker && worker-build --release)
          node tools/check-prd-empty-baseline.mjs
      - name: Verify existing target, upload version, promote and check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKARMA_WRANGLER_TOML: ${{ secrets.SKARMA_WRANGLER_TOML }}
          VERIFY_VERSION: ${{ inputs.verify_version }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ACTIVATE_PRD_EMPTY: ${{ inputs.activate_prd_empty || contains(github.event.head_commit.message, '[activate-prd-empty]') }}
        run: |
          remote_sha=$(git ls-remote origin refs/heads/feat/tencent-informed-web | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA" || { echo '::error::Branch moved; release the latest reviewed commit instead'; exit 1; }
          mode_args=(--deploy)
          if [ -n "$VERIFY_VERSION" ]; then
            mode_args=(--verify-version "$VERIFY_VERSION")
          elif [[ "$HEAD_MESSAGE" == *"[verify-cloudflare:"* ]]; then
            mode_args=(--verify-from-event)
          fi
          if [ "$ACTIVATE_PRD_EMPTY" = 'true' ]; then
            mode_args+=(--activate-prd-empty)
          fi
          python3 tools/cloudflare_release.py "${mode_args[@]}" --source-sha "$GITHUB_SHA"
      - name: Link the synthetic courses after confirmed activation
        if: inputs.restore_demo || contains(github.event.head_commit.message, '[restore-demo:20261023]')
        env:
          SKARMA_TEST_LOGIN: ${{ secrets.SKARMA_TEST_LOGIN }}
        run: python3 tools/restore_demo_batch.py --phase links --confirm-append skarma-demo-20261023
      - name: Publish sanitized synthetic restore receipts
        if: always() && (inputs.restore_demo || contains(github.event.head_commit.message, '[restore-demo:20261023]'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-restore-${{ github.sha }}
          path: .local/demo-restore/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish sanitized release receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-release-${{ github.sha }}
          path: .local/cloudflare-release/receipt.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove private configuration and logs
        if: always()
        run: |
          rm -f deploy/cloud-worker/wrangler.toml
          rm -rf .local/cloudflare-release/private
