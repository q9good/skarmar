name: skarma
services:
  app:
    image: skarma-host:local
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile
    restart: unless-stopped
    environment:
      SKARMA_PRODUCTION: ${SKARMA_PRODUCTION:-1}
      SKARMA_PUBLIC_URL: ${SKARMA_PUBLIC_URL:?请填写应用的 HTTPS 网址}
      SKARMA_SPACE: ${SKARMA_SPACE:-family}
      SKARMA_AUTH: required
      SKARMA_DEMO: "0"
    ports:
      - "127.0.0.1:${SKARMA_LOCAL_PORT:-3001}:3001"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, skarma-api, healthcheck]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/cloudflare_tunnel_token]
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    secrets: [cloudflare_tunnel_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  data:
secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare-tunnel-token
